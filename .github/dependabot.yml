version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /backend
    schedule: &weekly-java
      interval: weekly
      day: monday
      time: "02:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups: &java-groups
      java-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /gateway
    schedule: *weekly-java
    open-pull-requests-limit: 3
    groups: *java-groups

  - package-ecosystem: maven
    directory: /chat-service
    schedule: *weekly-java
    open-pull-requests-limit: 3
    groups: *java-groups

  - package-ecosystem: maven
    directory: /crm-service
    schedule: *weekly-java
    open-pull-requests-limit: 3
    groups: *java-groups

  - package-ecosystem: maven
    directory: /document-service
    schedule: *weekly-java
    open-pull-requests-limit: 3
    groups: *java-groups

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "02:00"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "02:15"
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 5
