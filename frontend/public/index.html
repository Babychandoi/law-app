    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <link
      rel="preload"
      as="image"
      href="/assets/images/slide.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <meta
      name="description"
      content="Luật Poip Legal tư vấn sở hữu trí tuệ và pháp lý doanh nghiệp cho doanh nghiệp, nhà sáng lập và người sáng tạo."
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <!-- ✅ Thêm Google Ads tag ở đây -->
    <!-- Google tag (gtag.js) -->
    <script>
      window.dataLayer = window.dataLayer || [];
      window.gtag =
        window.gtag ||
        function gtag() {
          window.dataLayer.push(arguments);
        };

      function loadGoogleAds() {
        if (window.__googleAdsLoaded) return;
        window.__googleAdsLoaded = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=AW-17438859267';
        document.head.appendChild(script);
        window.gtag('js', new Date());
        window.gtag('config', 'AW-17438859267');
      }

      function scheduleGoogleAds() {
        if ('requestIdleCallback' in window) {
          window.requestIdleCallback(loadGoogleAds, { timeout: 4000 });
        } else {
          window.setTimeout(loadGoogleAds, 3000);
        }
      }

      if (document.readyState === 'complete') {
        scheduleGoogleAds();
      } else {
        window.addEventListener('load', scheduleGoogleAds, { once: true });
      }
    </script>
    <!-- ✅ Hết phần thêm -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "url": "https://luatpoip.com",
        "logo": "https://luatpoip.com/assets/images/logo-poip-v2.png"
      }
    </script>
  </head>

  </body>
