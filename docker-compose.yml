services:
  # ==================== NGINX ====================
  nginx:
    image: nginx:1.25-alpine
    container_name: law-app-nginx
    mem_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
      - gateway
      - minio
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== FRONTEND ====================
  # Prod urls come from frontend/.env.production (CRA bakes them at `npm run build`),
  # not from build args — so the bundle can never fall back to localhost.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: law-app-frontend
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== BACKEND ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: law-app-backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 900m
    env_file:
      - .env
    environment:
      # Cap JVM heap to ~70% of mem_limit so the container is not OOM-killed (exit 137).
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      # Do not expose MinIO root/other-service credentials to this process.
      MINIO_ACCESS_KEY: ${MINIO_BACKEND_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      MINIO_SECRET_KEY: ${MINIO_BACKEND_SECRET_KEY:-${MINIO_SECRET_KEY}}
      MINIO_CHAT_ACCESS_KEY: ""
      MINIO_CHAT_SECRET_KEY: ""
      MINIO_DOCUMENT_ACCESS_KEY: ""
      MINIO_DOCUMENT_SECRET_KEY: ""
    # Reach the 9Router (AI chat) instance running on the host at host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== API GATEWAY ====================
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: law-app-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 500m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      - backend
      - chat-service
      - crm-service
      - document-service
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== CHAT SERVICE (internal staff chat) ====================
  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: law-app-chat
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 700m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      # Override the monolith's MongoDB DB name that leaks in via .env, so chat-service uses its
      # OWN isolated database instead of writing into law_app_chat (the guest-chat DB).
      SPRING_DATA_MONGODB_DATABASE: ${CHAT_MONGODB_DATABASE:-law-app-staff-chat}
      MINIO_ACCESS_KEY: ${MINIO_CHAT_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      MINIO_SECRET_KEY: ${MINIO_CHAT_SECRET_KEY:-${MINIO_SECRET_KEY}}
      MINIO_BACKEND_ACCESS_KEY: ""
      MINIO_BACKEND_SECRET_KEY: ""
      MINIO_DOCUMENT_ACCESS_KEY: ""
      MINIO_DOCUMENT_SECRET_KEY: ""
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== CRM SERVICE (customer-care microservice) ====================
  crm-service:
    build:
      context: ./crm-service
      dockerfile: Dockerfile
    container_name: law-app-crm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 700m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      # Override the shared monolith datasource env so CRM points at its OWN database.
      # (Spring relaxed-binding makes SPRING_DATASOURCE_URL from .env win over application.yml.)
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/law_app_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== DOCUMENT SERVICE (Word template generation) ====================
  document-service:
    build:
      context: ./document-service
      dockerfile: Dockerfile
    container_name: law-app-documents
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9100/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 700m
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70"
      DOCUMENT_MONGODB_HOST: law-app-mongodb
      DOCUMENT_MONGODB_PORT: 27017
      DOCUMENT_MONGODB_DATABASE: ${DOCUMENT_MONGODB_DATABASE:-law-app-documents}
      # Use container-name DNS aliases (these resolve reliably on the running prod network).
      SPRING_DATA_REDIS_HOST: law-app-redis
      SPRING_DATA_REDIS_PORT: 6379
      MINIO_URL: http://law-app-minio:9000
      MINIO_ACCESS_KEY: ${MINIO_DOCUMENT_ACCESS_KEY:-${MINIO_ACCESS_KEY}}
      MINIO_SECRET_KEY: ${MINIO_DOCUMENT_SECRET_KEY:-${MINIO_SECRET_KEY}}
      MINIO_BACKEND_ACCESS_KEY: ""
      MINIO_BACKEND_SECRET_KEY: ""
      MINIO_CHAT_ACCESS_KEY: ""
      MINIO_CHAT_SECRET_KEY: ""
      DOCUMENT_ANTIVIRUS_ENABLED: ${DOCUMENT_ANTIVIRUS_ENABLED:-true}
      DOCUMENT_ANTIVIRUS_FAIL_CLOSED: ${DOCUMENT_ANTIVIRUS_FAIL_CLOSED:-true}
      DOCUMENT_ANTIVIRUS_HOST: clamav
      DOCUMENT_ANTIVIRUS_PORT: 3310
      # Xuất PDF qua Gotenberg. Tắt mặc định; bật bằng DOCUMENT_PDF_ENABLED=true (cần chạy gotenberg).
      DOCUMENT_PDF_ENABLED: ${DOCUMENT_PDF_ENABLED:-false}
      DOCUMENT_PDF_GOTENBERG_URL: http://gotenberg:3000
      # Gửi email (link chia sẻ bảo mật). Tắt mặc định; bật khi đã cấu hình SMTP + URL công khai.
      DOCUMENT_MAIL_ENABLED: ${DOCUMENT_MAIL_ENABLED:-false}
      DOCUMENT_MAIL_FROM: ${DOCUMENT_MAIL_FROM:-no-reply@luatpoip.com}
      DOCUMENT_SHARE_PUBLIC_BASE_URL: ${DOCUMENT_SHARE_PUBLIC_BASE_URL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    security_opt:
      - no-new-privileges:true
    depends_on:
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      clamav:
        condition: service_healthy
    networks:
      law-app-network:
        aliases:
          - document-service
          - law-app-documents
    restart: unless-stopped

  # ==================== PDF CONVERTER (opt-in; private network only) ====================
  # Chuyển DOCX -> PDF cho document-service. Bật tính năng bằng DOCUMENT_PDF_ENABLED=true rồi khởi
  # động service này. Không expose ra ngoài; chỉ document-service gọi qua mạng nội bộ.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: law-app-gotenberg
    command:
      - "gotenberg"
      - "--api-timeout=60s"
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      law-app-network:
        aliases:
          - gotenberg
    restart: unless-stopped

  # ==================== MALWARE SCANNER (private network only) ====================
  # ClamAV documents 3 GiB minimum / 4 GiB preferred RAM for current signature sets.
  # The _base image keeps definitions in the persisted volume and FreshClam updates them in-place.
  clamav:
    image: clamav/clamav:1.5.2_base
    container_name: law-app-clamav
    mem_limit: 4g
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping=1", "/dev/null"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 5m
    security_opt:
      - no-new-privileges:true
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== RABBITMQ (STOMP broker relay) ====================
  rabbitmq:
    image: rabbitmq:3-management
    container_name: law-app-rabbitmq
    mem_limit: 384m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./docker/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== MYSQL ====================
  mysql:
    image: mysql:8.0
    container_name: law-app-mysql
    mem_limit: 512m
    expose:
      - "3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== MONGODB ====================
  mongodb:
    image: mongo:7.0
    container_name: law-app-mongodb
    mem_limit: 384m
    expose:
      - "27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${SPRING_DATA_MONGODB_DATABASE}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongo/init:/docker-entrypoint-initdb.d
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== REDIS ====================
  redis:
    image: redis:7-alpine
    container_name: law-app-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== MINIO ====================
  minio:
    build:
      context: ./docker/minio
      dockerfile: Dockerfile
      args:
        MINIO_VERSION: RELEASE.2025-10-15T17-29-55Z
    image: law-app/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: law-app-minio
    mem_limit: 256m
    # Object storage is internal. Public assets, when needed, are exposed through the controlled
    # tunnel route; the S3 API and admin console are not bound directly to the host.
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== MINIO SETUP ====================
  minio-setup:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z.hotfix.e98f1ead
    depends_on:
      - minio
    env_file:
      - .env
    volumes:
      - ./docker/minio/policies:/policies:ro
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY};
      mc mb myminio/$${MINIO_BUCKET_IMAGES} --ignore-existing;
      mc anonymous set public myminio/$${MINIO_BUCKET_IMAGES};
      mc mb myminio/$${MINIO_BUCKET_CVS} --ignore-existing;
      mc anonymous set none myminio/$${MINIO_BUCKET_CVS};
      mc mb myminio/$${MINIO_BUCKET_STAFF_FILES} --ignore-existing;
      mc anonymous set none myminio/$${MINIO_BUCKET_STAFF_FILES};
      mc mb myminio/$${MINIO_BUCKET_DOCUMENT_TEMPLATES} --ignore-existing;
      mc mb myminio/$${MINIO_BUCKET_GENERATED_DOCUMENTS} --ignore-existing;
      if [ -n \"$${MINIO_BACKEND_ACCESS_KEY}\" ] && [ -n \"$${MINIO_BACKEND_SECRET_KEY}\" ]; then
        mc admin user add myminio \"$${MINIO_BACKEND_ACCESS_KEY}\" \"$${MINIO_BACKEND_SECRET_KEY}\";
        sed -e \"s|__IMAGES_BUCKET__|$${MINIO_BUCKET_IMAGES}|g\" -e \"s|__CVS_BUCKET__|$${MINIO_BUCKET_CVS}|g\" /policies/backend-policy.json > /tmp/backend-policy.json;
        mc admin policy create myminio lawapp-backend /tmp/backend-policy.json;
        mc admin policy attach myminio lawapp-backend --user \"$${MINIO_BACKEND_ACCESS_KEY}\";
      fi;
      if [ -n \"$${MINIO_CHAT_ACCESS_KEY}\" ] && [ -n \"$${MINIO_CHAT_SECRET_KEY}\" ]; then
        mc admin user add myminio \"$${MINIO_CHAT_ACCESS_KEY}\" \"$${MINIO_CHAT_SECRET_KEY}\";
        sed -e \"s|__STAFF_BUCKET__|$${MINIO_BUCKET_STAFF_FILES}|g\" /policies/chat-policy.json > /tmp/chat-policy.json;
        mc admin policy create myminio lawapp-chat /tmp/chat-policy.json;
        mc admin policy attach myminio lawapp-chat --user \"$${MINIO_CHAT_ACCESS_KEY}\";
      fi;
      if [ -n \"$${MINIO_DOCUMENT_ACCESS_KEY}\" ] && [ -n \"$${MINIO_DOCUMENT_SECRET_KEY}\" ]; then
        mc admin user add myminio \"$${MINIO_DOCUMENT_ACCESS_KEY}\" \"$${MINIO_DOCUMENT_SECRET_KEY}\";
        sed -e \"s|__TEMPLATES_BUCKET__|$${MINIO_BUCKET_DOCUMENT_TEMPLATES}|g\" -e \"s|__GENERATED_BUCKET__|$${MINIO_BUCKET_GENERATED_DOCUMENTS}|g\" /policies/document-policy.json > /tmp/document-policy.json;
        mc admin policy create myminio lawapp-documents /tmp/document-policy.json;
        mc admin policy attach myminio lawapp-documents --user \"$${MINIO_DOCUMENT_ACCESS_KEY}\";
      fi;
      exit 0;
      "
    networks:
      - law-app-network

  # ==================== CLOUDFLARE TUNNEL ====================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: law-app-cloudflared
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      - ./cloudflared/credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      - frontend
      - backend
      - gateway
      - minio
    networks:
      - law-app-network
    restart: unless-stopped

  # ==================== KEEP-WARM (chống cold-start tunnel/pool) ====================
  # Ping nhẹ định kỳ qua PUBLIC URL để giữ ấm đường Cloudflare edge->tunnel->origin và pool
  # kết nối backend, tránh request đầu sau lúc nhàn rỗi bị chậm (1-2s). Miễn phí, ~1 req/phút.
  warmer:
    image: curlimages/curl:latest
    container_name: law-app-warmer
    command:
      - sh
      - -c
      - |
        while true; do
          curl -s -o /dev/null -m 15 "https://api.luatpoip.com/services?_w=$$(date +%s)" || true
          curl -s -o /dev/null -m 15 "https://gateway.luatpoip.com/ws-staff/info?_w=$$(date +%s)" || true
          sleep 60
        done
    networks:
      - law-app-network
    restart: unless-stopped

volumes:
  mysql_data:
  mongodb_data:
  redis_data:
  minio_data:
  rabbitmq_data:
  clamav_data:

networks:
  law-app-network:
    driver: bridge

