<!doctype html>
<html lang="vi">
  <head>
    <!-- Google tag (gtag.js) — 1 loader duy nhất, config nhiều ID (GA4 + Google Ads).
         data-cfasync="false" để Cloudflare Rocket Loader KHÔNG viết lại type của script
         (nếu bị viết lại, Google dò không ra thẻ dù thẻ vẫn chạy trên trình duyệt). -->
    <script
      data-cfasync="false"
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-W3K9FB9FC3"
    ></script>
    <script data-cfasync="false">
      window.dataLayer = window.dataLayer || [];
      window.gtag =
        window.gtag ||
        function gtag() {
          window.dataLayer.push(arguments);
        };
      gtag('js', new Date());
      gtag('config', 'G-W3K9FB9FC3'); // GA4
      gtag('config', 'AW-17438859267'); // Google Ads
    </script>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/assets/images/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#171717" />
    <link
      rel="preload"
      as="image"
      href="/assets/images/slide.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <meta
      name="description"
      content="Luật Poip Legal tư vấn sở hữu trí tuệ và pháp lý doanh nghiệp cho doanh nghiệp, nhà sáng lập và người sáng tạo."
    />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "url": "https://luatpoip.com",
        "logo": "https://luatpoip.com/assets/images/logo-poip-v2.png"
      }
    </script>
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
