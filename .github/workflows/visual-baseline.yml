name: Visual baseline

# Sinh (hoặc cập nhật) baseline ảnh cho visual regression NGAY TRONG CI để render khớp job so sánh.
# Chạy thủ công từ tab Actions. Sau khi chạy, baseline được commit tự động vào nhánh hiện tại.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baseline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Sinh baseline (Playwright container)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
      options: --ipc=host
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --legacy-peer-deps
      - name: Build production
        run: npm run build
        env:
          CI: 'true'
      - name: Sinh baseline (--update-snapshots)
        run: |
          npx --yes serve -s build -l 3000 >/tmp/serve.log 2>&1 &
          npx --yes wait-on http://localhost:3000 -t 60000
          npx playwright test --project=visual --update-snapshots
        env:
          E2E_BASE_URL: http://localhost:3000
      - name: Commit baseline vào nhánh
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/visual.spec.ts-snapshots
          if git diff --cached --quiet; then
            echo "Baseline không thay đổi."
          else
            git commit -m "chore(visual): cập nhật baseline ảnh [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
