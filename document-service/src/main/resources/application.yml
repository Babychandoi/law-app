server:
  port: ${DOCUMENT_SERVICE_PORT:8084}

spring:
  application:
    name: document-service

  data:
    mongodb:
      # Build connection from document-specific vars ONLY; do not reference monolith/chat SPRING_DATA_MONGODB_*.
      uri: mongodb://root:${MONGO_ROOT_PASSWORD}@${DOCUMENT_MONGODB_HOST:law-app-mongodb}:${DOCUMENT_MONGODB_PORT:27017}/${DOCUMENT_MONGODB_DATABASE:law-app-documents}?authSource=admin
      auto-index-creation: true

    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  servlet:
    multipart:
      max-file-size: ${DOCUMENT_MAX_FILE_SIZE:25MB}
      max-request-size: ${DOCUMENT_MAX_REQUEST_SIZE:30MB}

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:true}

jwt:
  signerKey: ${JWT_SIGNER_KEY}

auth:
  cookie:
    domain: ${AUTH_COOKIE_DOMAIN:}

minio:
  url: ${MINIO_URL}
  access-key: ${MINIO_DOCUMENT_ACCESS_KEY:${MINIO_ACCESS_KEY}}
  secret-key: ${MINIO_DOCUMENT_SECRET_KEY:${MINIO_SECRET_KEY}}
  bucket:
    templates: ${MINIO_BUCKET_DOCUMENT_TEMPLATES:document-templates}
    generated: ${MINIO_BUCKET_GENERATED_DOCUMENTS:generated-documents}

document:
  encryption:
    # Base64-encoded 32-byte key. New document writes fail closed when this is missing/invalid.
    key: ${DOCUMENT_DATA_ENCRYPTION_KEY:}
    key-id: ${DOCUMENT_DATA_ENCRYPTION_KEY_ID:local-v1}
    # Comma-separated keyId:base64 entries retained only for decrypting historical rows.
    previous-keys: ${DOCUMENT_DATA_ENCRYPTION_PREVIOUS_KEYS:}
  antivirus:
    enabled: ${DOCUMENT_ANTIVIRUS_ENABLED:false}
    fail-closed: ${DOCUMENT_ANTIVIRUS_FAIL_CLOSED:true}
    host: ${DOCUMENT_ANTIVIRUS_HOST:clamav}
    port: ${DOCUMENT_ANTIVIRUS_PORT:3310}
    connect-timeout-ms: ${DOCUMENT_ANTIVIRUS_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${DOCUMENT_ANTIVIRUS_READ_TIMEOUT_MS:30000}
  pdf:
    # Xuất PDF qua Gotenberg (LibreOffice headless sau HTTP). Tắt mặc định; bật khi đã chạy Gotenberg.
    enabled: ${DOCUMENT_PDF_ENABLED:false}
    gotenberg-url: ${DOCUMENT_PDF_GOTENBERG_URL:http://gotenberg:3000}
  mail:
    # Gửi tài liệu (link chia sẻ bảo mật) qua email. Tắt mặc định; bật khi đã cấu hình SMTP.
    enabled: ${DOCUMENT_MAIL_ENABLED:false}
    from: ${DOCUMENT_MAIL_FROM:no-reply@luatpoip.com}
  share:
    # URL công khai gốc để dựng link chia sẻ trong email (vd https://gateway.luatpoip.com).
    public-base-url: ${DOCUMENT_SHARE_PUBLIC_BASE_URL:}
  reconciliation:
    # Dọn file rác trên MinIO không còn metadata tham chiếu (do lỗi ghi sau upload).
    enabled: ${DOCUMENT_RECONCILIATION_ENABLED:true}
    # Chỉ xóa object cũ hơn số giờ này để không đụng upload đang diễn ra.
    grace-hours: ${DOCUMENT_RECONCILIATION_GRACE_HOURS:24}
    # Lịch chạy (mặc định 03:00 hằng ngày).
    cron: ${DOCUMENT_RECONCILIATION_CRON:0 0 3 * * *}

logging:
  pattern:
    # Chèn correlation id [reqId] vào mỗi dòng log
    level: "%5p [%X{reqId:-}]"
  level:
    org.law_app.document: INFO

# ===== Observability: health/readiness probes + Prometheus =====
management:
  server:
    port: 9100
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    # SMTP là tùy chọn (tắt mặc định) — không để mail health làm probe DOWN khi chưa cấu hình.
    mail:
      enabled: false
