name: E2E (Playwright)

# Chạy end-to-end (đăng nhập/phân quyền/DataTable/chat) trên môi trường đang chạy.
# Cần cấu hình secrets: E2E_ADMIN_USER/PASS, E2E_STAFF_USER/PASS (và tùy chọn var E2E_BASE_URL).
# Kích hoạt THỦ CÔNG (workflow_dispatch) để không chặn pipeline PR và tránh fail khi chưa
# cấu hình secrets. Bật lịch/cron sau khi đã set secrets E2E_* trong repo.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL đích (mặc định https://luatpoip.com)'
        required: false
        default: ''

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        env:
          E2E_BASE_URL: ${{ github.event.inputs.base_url || vars.E2E_BASE_URL || 'https://luatpoip.com' }}
          E2E_ADMIN_USER: ${{ secrets.E2E_ADMIN_USER }}
          E2E_ADMIN_PASS: ${{ secrets.E2E_ADMIN_PASS }}
          E2E_STAFF_USER: ${{ secrets.E2E_STAFF_USER }}
          E2E_STAFF_PASS: ${{ secrets.E2E_STAFF_PASS }}
        run: npm run e2e
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
