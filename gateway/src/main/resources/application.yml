server:
  port: ${GATEWAY_PORT:8081}

spring:
  application:
    name: gateway
  cloud:
    gateway:
      httpclient:
        # Long-lived upstream connections for SockJS/WebSocket transports.
        connect-timeout: 5000
        response-timeout: 0
      routes:
        # ---- Staff chat microservice (REST) ----
        # Public prefix /staff-chat/** keeps it distinct from the monolith's guest /chat/** paths.
        - id: chat-service-rest
          uri: ${CHAT_SERVICE_URI:http://law-app-chat:8082}
          predicates:
            - Path=/staff-chat/**
          filters:
            - RewritePath=/staff-chat/(?<segment>.*), /chat/${segment}

        # ---- Staff chat microservice (WebSocket / SockJS) ----
        - id: chat-service-ws
          uri: ${CHAT_SERVICE_WS_URI:ws://law-app-chat:8082}
          predicates:
            - Path=/ws-staff/**

        # ---- Monolith WebSocket (guest chat + notifications) ----
        - id: monolith-ws
          uri: ${MONOLITH_WS_URI:ws://law-app-backend:8080}
          predicates:
            - Path=/ws/**

        # ---- Everything else -> monolith ----
        - id: monolith
          uri: ${MONOLITH_URI:http://law-app-backend:8080}
          predicates:
            - Path=/auth/**,/services/**,/service/**,/jobs/**,/news/**,/customer/**,/notifications/**,/upload,/chat/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_CORS_ORIGINS:http://localhost:3000,https://luatpoip.com,https://www.luatpoip.com}
            allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
            allowedHeaders: ["*"]
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health
