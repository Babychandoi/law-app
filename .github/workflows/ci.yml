name: CI

on:
  push:
    branches: [main, 'phong/**', 'feat/**']
  pull_request:
    branches: [main]

# Huỷ các lần chạy cũ trên cùng nhánh khi có push mới.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint · format · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Prettier check
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm test -- --watchAll=false
      - name: Production build (CI=true, warning = error)
        run: npm run build
        env:
          CI: 'true'

  java:
    name: Java build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, gateway, chat-service, crm-service, document-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Compile + package (tests chạy nếu có). Không dùng -DskipTests trong CI.
      - name: Maven package
        run: mvn -B -ntp package

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
