server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # DNS nội bộ của Docker để proxy_pass dùng biến (service `backend`) phân giải được lúc chạy.
    resolver 127.0.0.11 valid=30s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# CSP enforce: chỉ tập directive KHÔNG phụ thuộc host bên thứ ba nên không thể vỡ
        # (chống clickjacking + chặn object/base injection). Không đặt default-src/script-src
        # ở bản enforce để không chặn nhầm Google Ads/Analytics/widget.
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        # CSP đầy đủ ở chế độ Report-Only: KHÔNG chặn, chỉ log để rà & siết dần sau này.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://static.cloudflareinsights.com https://ajax.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.luatpoip.com wss://api.luatpoip.com https://gateway.luatpoip.com wss://gateway.luatpoip.com https://minio.luatpoip.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.googletagmanager.com https://td.doubleclick.net https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files /index.html =404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket proxy
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Sitemap động do backend sinh (dịch vụ/tin tức/tuyển dụng từ DB). Exact match -> ưu tiên.
    location = /sitemap.xml {
        proxy_pass http://backend:8080/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OG cho BOT mạng xã hội: /tin-tuc/{slug} -> backend sinh thẻ Open Graph ĐÚNG bài viết
    # (FB/Zalo không chạy JS nên không đọc OG do SPA set runtime). Người thật vẫn nhận SPA.
    location ~ ^/tin-tuc/(?<og_slug>[^/]+)/?$ {
        set $og_bot 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator)") {
            set $og_bot 1;
        }
        if ($og_bot = 1) {
            proxy_pass http://backend:8080/og/news/$og_slug;
        }
        try_files /index.html =404;
    }

    # ===== HTML VAN BAN THUAN CHO TRINH QUET =====
    # SPA React chi tra ve <div id="root"> rong: 0 lien ket, 0 the h1, 166 ky tu van ban. Trinh
    # quet khong chay JavaScript khong co gi de doc cung khong co duong di tiep — do la ly do
    # Semrush chi quet duoc 2 trang tren toan site. Cac luat duoi day dua bot sang backend de nhan
    # HTML co noi dung that; nguoi dung that van nhan SPA binh thuong.

    # Trang chu
    location = / {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        set $og_path /og/home;
        if ($crawler = 1) { proxy_pass http://backend:8080$og_path; }
        try_files /index.html =404;
    }

    # Danh sach dich vu
    location = /dich-vu {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        set $og_path /og/services;
        if ($crawler = 1) { proxy_pass http://backend:8080$og_path; }
        try_files /index.html =404;
    }

    # Danh sach tin tuc
    location = /tin-tuc {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        set $og_path /og/news;
        if ($crawler = 1) { proxy_pass http://backend:8080$og_path; }
        try_files /index.html =404;
    }

    # Landing page chay ads. Chung DA nam trong sitemap nen bot chac chan vao;
    # khong render thi hoa ra moi Google vao roi cho xem trang trang.
    location ~ ^/lp/(?<lp_slug>[a-z0-9-]+)/?$ {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        if ($crawler = 1) { proxy_pass http://backend:8080/og/landing/$lp_slug; }
        try_files /index.html =404;
    }

    # Chi tiet vi tri tuyen dung
    location ~ ^/tuyen-dung/vi-tri/(?<job_id>[A-Za-z0-9-]+)/?$ {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        if ($crawler = 1) { proxy_pass http://backend:8080/og/job/$job_id; }
        try_files /index.html =404;
    }

    # Danh sach vi tri tuyen dung
    location = /tuyen-dung {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        set $og_path /og/jobs;
        if ($crawler = 1) { proxy_pass http://backend:8080$og_path; }
        try_files /index.html =404;
    }

    # Trang dich vu dong: /{slug} mot doan duy nhat.
    # Loai tru cac duong dan KHONG phai dich vu — thieu mot cai la bot nhan nham noi dung.
    # Regex [a-z0-9-] khong chua dau cham nen /robots.txt, /llms.txt, /sitemap.xml khong khop.
    location ~ ^/(?!(?:dich-vu|dich-vu-khac|tin-tuc|ve-chung-toi|lien-he|tuyen-dung|cam-on|chinh-sach-bao-mat|giai-phap-phap-ly|lp|static|assets|favicon|manifest)(?:/|$))(?<svc_slug>[a-z0-9-]+)/?$ {
        set $crawler 0;
        if ($http_user_agent ~* "(facebookexternalhit|Facebot|Twitterbot|Zalo|Telegram|LinkedInBot|WhatsApp|Slackbot|Discordbot|Pinterest|redditbot|Googlebot|bingbot|SkypeUriPreview|vkShare|Applebot|W3C_Validator|SemrushBot|AhrefsBot|DotBot|GPTBot|PerplexityBot|ClaudeBot|Bytespider|YandexBot|DuckDuckBot|Baiduspider)") { set $crawler 1; }
        if ($crawler = 1) { proxy_pass http://backend:8080/og/service/$svc_slug; }
        try_files /index.html =404;
    }

    # React Router - serve index.html for all routes
    location / {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
# CSP enforce: chỉ tập directive KHÔNG phụ thuộc host bên thứ ba nên không thể vỡ
        # (chống clickjacking + chặn object/base injection). Không đặt default-src/script-src
        # ở bản enforce để không chặn nhầm Google Ads/Analytics/widget.
        add_header Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'" always;
        # CSP đầy đủ ở chế độ Report-Only: KHÔNG chặn, chỉ log để rà & siết dần sau này.
        add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://googleads.g.doubleclick.net https://www.googleadservices.com https://static.cloudflareinsights.com https://ajax.cloudflare.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://api.luatpoip.com wss://api.luatpoip.com https://gateway.luatpoip.com wss://gateway.luatpoip.com https://minio.luatpoip.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com https://www.googletagmanager.com https://td.doubleclick.net https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
}
