server:
  port: ${CHAT_SERVICE_PORT:8082}

spring:
  application:
    name: chat-service

  # ================= MONGODB (staff-chat DB, isolated from monolith) =================
  data:
    mongodb:
      uri: mongodb://root:${MONGO_ROOT_PASSWORD}@${CHAT_MONGODB_HOST:law-app-mongodb}:${CHAT_MONGODB_PORT:27017}/${CHAT_MONGODB_DATABASE:law-app-staff-chat}?authSource=admin

    # ================= REDIS (presence + shared token revocation) =================
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  # ================= FILE UPLOAD =================
  servlet:
    multipart:
      max-file-size: ${CHAT_MAX_FILE_SIZE:25MB}
      max-request-size: ${CHAT_MAX_REQUEST_SIZE:30MB}

# ================= JWT (shared HS512 secret with monolith, offline verify) =================
jwt:
  signerKey: ${JWT_SIGNER_KEY}

# ================= AUTH COOKIES (CSRF token cookie domain, shared with monolith) =================
auth:
  cookie:
    domain: ${AUTH_COOKIE_DOMAIN:}

# ================= RABBITMQ STOMP RELAY (scale-out broker) =================
rabbitmq:
  stomp:
    host: ${RABBITMQ_STOMP_HOST:law-app-rabbitmq}
    port: ${RABBITMQ_STOMP_PORT:61613}
  user: ${RABBITMQ_USER:guest}
  pass: ${RABBITMQ_PASS:guest}

# ================= MINIO (reuse existing instance) =================
minio:
  url: ${MINIO_URL}
  public-url: ${MINIO_PUBLIC_URL}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket:
    files: ${MINIO_BUCKET_STAFF_FILES:staff-files}

# ================= MONOLITH (staff directory source) =================
monolith:
  base-url: ${MONOLITH_INTERNAL_URL:http://law-app-backend:8080}

# ================= CORS =================
cors:
  allowed-origins: ${CHAT_CORS_ORIGINS:http://localhost:3000,https://luatpoip.com,https://www.luatpoip.com}

logging:
  level:
    org.law_app.chat: INFO
    org.springframework.web.socket: INFO
