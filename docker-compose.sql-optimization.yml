# Opt-in deployment override for the SQL optimization release.
# Preserve the existing production schema while its CRM naming drift is reviewed.
services:
  backend:
    build:
      dockerfile: Dockerfile.prebuilt
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_GENERATE_DDL: "false"
  crm-service:
    build:
      dockerfile: Dockerfile.prebuilt
    environment:
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      SPRING_JPA_GENERATE_DDL: "false"
      CRM_JPA_DDL_AUTO: none
      # The existing crm.cases queue has no x-arguments. Its DLX is set by broker policy.
      APP_RABBITMQ_CASE_QUEUE_DEAD_LETTER_ARGUMENTS: "false"
