server:
  port: ${CRM_SERVICE_PORT:8083}

spring:
  application:
    name: crm-service

  # ================= OWN MySQL DATABASE (law_app_crm) =================
  # SPRING_DATASOURCE_* are injected by docker-compose (overriding the shared monolith values)
  # so CRM always points at law_app_crm.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://law-app-mysql:3306/law_app_crm?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:lawapp}
    password: ${SPRING_DATASOURCE_PASSWORD:lawapp123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: ${CRM_JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # ================= REDIS (shared token revocation) =================
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  # ================= RABBITMQ (AMQP — consume case events) =================
  rabbitmq:
    host: ${RABBITMQ_AMQP_HOST:law-app-rabbitmq}
    port: ${RABBITMQ_AMQP_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}

# ================= JWT (shared HS512 secret, offline verify) =================
jwt:
  signerKey: ${JWT_SIGNER_KEY}

auth:
  cookie:
    domain: ${AUTH_COOKIE_DOMAIN:}

# ================= MONOLITH (staff directory source) =================
monolith:
  base-url: ${MONOLITH_INTERNAL_URL:http://law-app-backend:8080}

logging:
  pattern:
    # Chèn correlation id [reqId] vào mỗi dòng log
    level: "%5p [%X{reqId:-}]"
  level:
    org.law_app.crm: INFO

# ===== Observability: health/readiness probes + Prometheus =====
management:
  server:
    port: 9100
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
