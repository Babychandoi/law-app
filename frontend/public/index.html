<!doctype html>

    <!-- Google tag (gtag.js) — 1 loader duy nhất, config nhiều ID (GA4 + Google Ads).
         data-cfasync="false" để Cloudflare Rocket Loader KHÔNG viết lại type của script
         (nếu bị viết lại, Google dò không ra thẻ dù thẻ vẫn chạy trên trình duyệt). -->
    <script
      data-cfasync="false"
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-W3K9FB9FC3"
    ></script>
    <script data-cfasync="false">
      window.dataLayer = window.dataLayer || [];
      window.gtag =
        window.gtag ||
        function gtag() {
          window.dataLayer.push(arguments);
        };
      gtag('js', new Date());
      // GA4: tắt page_view tự động — SPA tự gửi page_view mỗi route (chỉ trang công khai)
      // trong src/shared/analytics/pageview.ts để không đếm trùng và loại khu nội bộ.
      gtag('config', 'G-W3K9FB9FC3', { send_page_view: false }); // GA4
      gtag('config', 'AW-18319389912'); // Google Ads (thay tài khoản cũ AW-17438859267)
    </script>
